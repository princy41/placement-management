services:

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  backend:
    build: ./backend
    expose:
      - "5000"
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/placementdb
    depends_on:
      - mongodb

  mongodb:
    image: mongo:7
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: